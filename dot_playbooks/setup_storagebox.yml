# Backups to the Hetzner storage box: a borg repo in backups/<this machine>,
# reached through a sub-account that only sees that folder, with this
# machine's backup key, which can only run `borg serve` on the repo.
# Create the sub-account first (see README.md).
#
# Needs STORAGEBOX_USER (main account, e.g. u123456) in the environment, and
# STORAGEBOX_SUB_USER (sub-account number, e.g. 1 for u123456-sub1) or asks
# for it. The main account is reached with your own ssh key.

- name: Backups to the Hetzner storage box
  hosts: localhost
  gather_facts: true
  vars:
    box_port: 23   # the storage box's ssh port (22 is sftp/scp only)
    box_user: "{{ lookup('env', 'STORAGEBOX_USER') }}"
    box_sub_number: "{{ lookup('env', 'STORAGEBOX_SUB_USER') }}"
    box_ssh: "-o StrictHostKeyChecking=accept-new"
    machine: "{{ ansible_facts.hostname }}"
    ssh_key: /home/borgbackup/.ssh/storagebox-backup

  tasks:
    - name: STORAGEBOX_USER is set
      ansible.builtin.assert:
        that: box_user | trim != ""
        quiet: true
        fail_msg: Set STORAGEBOX_USER (the main account, e.g. u123456) and run this playbook again.

    - name: Ask for the sub-account number
      ansible.builtin.pause:
        prompt: >-
          In the Hetzner Console, add a sub-account to the storage box with base
          folder backups/{{ machine }}, SSH support and external reachability on.
          Enter its number (2 for {{ box_user }}-sub2). Set STORAGEBOX_SUB_USER to skip this
      register: sub_number_prompt
      when: box_sub_number | trim == ""

    - name: Sub-account settings
      ansible.builtin.set_fact:
        box_sub_user: "{{ box_user }}-sub{{ (sub_number_prompt.user_input | default(box_sub_number)) | trim }}"

    # Kept on a re-run: the storage box already trusts it.
    - name: Backup key exists
      ansible.builtin.command:
        argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "borgbackup@{{ machine }}", -f, "{{ ssh_key }}"]
        creates: "{{ ssh_key }}"
      become: true
      become_user: borgbackup

    - name: Read the backup key
      ansible.builtin.slurp:
        src: "{{ ssh_key }}.pub"
      register: backup_pubkey
      become: true

    # The main account sees the whole box; the sub-account's backups/<machine>
    # is its home. (The box's shell runs single commands, no `;` or quotes.)
    - name: Folder for the sub-account's keys
      ansible.builtin.command:
        cmd: >-
          ssh {{ box_ssh }} -p {{ box_port }} {{ box_user }}@{{ box_user }}.your-storagebox.de
          mkdir -p backups/{{ machine }}/.ssh
      changed_when: false

    # The only key of the sub-account, and it can only run borg serve on
    # /home/repo (its backups/<machine>/repo). Copied up from a temporary file.
    - name: authorized_keys of the sub-account
      block:
        - name: Temporary authorized_keys
          ansible.builtin.tempfile:
            suffix: .authorized_keys
          register: keys_file

        - name: Write authorized_keys
          ansible.builtin.copy:
            dest: "{{ keys_file.path }}"
            content: |
              command="borg serve --restrict-to-repository /home/repo",restrict {{ backup_pubkey.content | b64decode | trim }}
            mode: "0600"

        - name: Upload authorized_keys
          ansible.builtin.command:
            cmd: >-
              scp {{ box_ssh }} -P {{ box_port }} {{ keys_file.path }}
              {{ box_user }}@{{ box_user }}.your-storagebox.de:backups/{{ machine }}/.ssh/authorized_keys
      always:
        - name: Remove the temporary authorized_keys
          ansible.builtin.file:
            path: "{{ keys_file.path }}"
            state: absent
          when: keys_file.path is defined

    - name: Repo, settings and backup script
      ansible.builtin.include_tasks: tasks/borg_repo.yml
      vars:
        target: storagebox
        repo_url: "ssh://{{ box_sub_user }}@{{ box_sub_user }}.your-storagebox.de:{{ box_port }}/./repo"
