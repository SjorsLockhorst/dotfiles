# The local side: the borgbackup user, which holds the backup keys and each
# target's settings. The backups themselves run as root (borg-backup-run, from
# chezmoi), so this user needs no sudo.
- name: Setup borg locally
  hosts: localhost
  gather_facts: false
  become: true

  tasks:
    - name: Borg is installed
      ansible.builtin.command:
        cmd: borg --version
      changed_when: false

    - name: Add borgbackup user
      ansible.builtin.user:
        name: borgbackup
        create_home: true
        state: present

    # Earlier versions of this playbook gave it full passwordless sudo.
    - name: borgbackup has no sudo
      ansible.builtin.file:
        path: /etc/sudoers.d/borgbackup
        state: absent

    - name: Folders for the backup keys and target settings
      ansible.builtin.file:
        path: "/home/borgbackup/{{ item }}"
        state: directory
        owner: borgbackup
        group: borgbackup
        mode: "0700"
      loop: [.ssh, targets]

    - name: Next steps
      ansible.builtin.debug:
        msg: "Borg is set up locally! Now run ansible-playbook ~/.playbooks/setup_nas.yml -K and/or setup_storagebox.yml -K"
