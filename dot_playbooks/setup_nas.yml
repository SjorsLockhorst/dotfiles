# Backups to the NAS (OpenMediaVault): a borg repo in the home folder of a NAS
# user named after this machine, reachable only with this machine's backup key,
# and only for `borg serve` on that repo. The user must exist already: create it
# in the OMV web UI first (see README.md).
#
# Logs in to the NAS as nas_admin (default: you), with sudo (-K: the same
# password as here). Override with -e nas_admin=<user>.

- name: Backup key for the NAS
  hosts: localhost
  gather_facts: true
  vars:
    nas_host: nas.home.lan
    nas_admin: "{{ lookup('pipe', 'id -un') }}"
    ssh_key: /home/borgbackup/.ssh/nas-backup
  tasks:
    - name: The NAS is reachable
      ansible.builtin.wait_for:
        host: "{{ nas_host }}"
        port: 22
        timeout: 30

    # Kept on a re-run: the NAS already trusts it.
    - name: Backup key exists
      ansible.builtin.command:
        argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "borgbackup@{{ ansible_facts.hostname }}", -f, "{{ ssh_key }}"]
        creates: "{{ ssh_key }}"
      become: true
      become_user: borgbackup

    - name: Read the backup key
      ansible.builtin.slurp:
        src: "{{ ssh_key }}.pub"
      register: backup_pubkey
      become: true

    - name: Add the NAS to the inventory
      ansible.builtin.add_host:
        name: "{{ nas_host }}"
        groups: nas_group
        ansible_user: "{{ nas_admin }}"
        ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new
        backup_user: "{{ ansible_facts.hostname }}"
        backup_pubkey: "{{ backup_pubkey.content | b64decode | trim }}"

- name: Backup user on the NAS
  hosts: nas_group
  gather_facts: false
  become: true
  tasks:
    - name: Look up the backup user
      ansible.builtin.getent:
        database: passwd
        key: "{{ backup_user }}"
        fail_key: false

    - name: The backup user exists (created in OMV)
      ansible.builtin.assert:
        that: ansible_facts.getent_passwd[backup_user] | default(none) is not none
        quiet: true
        fail_msg: >-
          User '{{ backup_user }}' does not exist on the NAS. Create it in the
          OpenMediaVault web UI (Users), in groups users and ssh, then run this
          playbook again.

    - name: Set the backup user's home folder
      ansible.builtin.set_fact:
        backup_home: "{{ ansible_facts.getent_passwd[backup_user][4] }}"

    # Earlier versions of this playbook gave the user passwordless sudo.
    - name: The backup user has no passwordless sudo
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        line: "{{ backup_user }} ALL=(ALL) NOPASSWD: ALL"
        state: absent
        validate: visudo -cf %s

    - name: .ssh folder of the backup user
      ansible.builtin.file:
        path: "{{ backup_home }}/.ssh"
        state: directory
        owner: "{{ backup_user }}"
        group: users
        mode: "0700"

    # The only key, and it can only run borg serve on ~/repo.
    - name: authorized_keys of the backup user
      ansible.builtin.copy:
        dest: "{{ backup_home }}/.ssh/authorized_keys"
        content: |
          command="borg serve --restrict-to-repository ~/repo",restrict {{ backup_pubkey }}
        owner: "{{ backup_user }}"
        group: users
        mode: "0600"

- name: Borg repo on the NAS
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Repo, settings and backup script
      ansible.builtin.include_tasks: tasks/borg_repo.yml
      vars:
        target: nas
        repo_url: "ssh://{{ ansible_facts.hostname }}@nas.home.lan/./repo"
        ssh_key: /home/borgbackup/.ssh/nas-backup
