# Framework Laptop 13 (AMD Ryzen AI 300), as installed on 2025-11-05: the
# pacstrap line in /var/log/pacman.log, plus what was added by hand before the
# dotfiles (sudo, git, chezmoi, zram-generator). Sourced by install.sh.

DISK=/dev/nvme0n1

# GPT: the EFI partition, and the rest for the root. /boot lives inside the
# root, so it's encrypted too: GRUB asks the passphrase.
ESP_SIZE=1G
ESP_MOUNT=/efi

ENCRYPTION=luks             # luks | none
FILESYSTEM=btrfs            # btrfs | ext4
# name:mountpoint, / first. Timeshift needs exactly @ and @home.
BTRFS_SUBVOLUMES=(@:/ @home:/home)
MOUNT_OPTIONS=compress=zstd:3   # for the root filesystem: change with FILESYSTEM

HOST_NAME=framework-arch
TIMEZONE=Europe/Amsterdam
LOCALE=en_US.UTF-8
KEYMAP=                     # empty: systemd's default (us)
USERNAME=sjors
BOOTLOADER_ID=GRUB          # the firmware's boot entry and EFI/<id>/ on the EFI partition

# Swap in compressed RAM (systemd zram-generator); empty for none.
ZRAM_SIZE='min(ram / 2, 16384)'

PACKAGES=(
    base linux linux-firmware amd-ucode
    btrfs-progs util-linux grub efibootmgr
    networkmanager iwd bluez bluez-utils
    vim neovim nano man
    sudo git chezmoi zram-generator
)
SERVICES=(NetworkManager bluetooth systemd-timesyncd)
