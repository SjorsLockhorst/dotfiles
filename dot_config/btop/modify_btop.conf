{{- /* chezmoi:modify-template */ -}}
{{- /* btop rewrites this file itself (on exit, and with new options after an
       upgrade), so chezmoi only sets the lines below, the ones that differ from
       btop's defaults (`btop --default-config`), and leaves the rest to btop.
       Without a file yet, btop fills in its defaults. Change these here: a hand
       edit (or btop's menu) is put back on apply. color_theme: the theme switcher
       renders the current theme there. */ -}}
{{- $conf := .chezmoi.stdin -}}
{{- $set := list
      (list "color_theme" (printf "%q" (joinPath .chezmoi.homeDir ".local/state/theme/current/btop.theme")))
      (list "net_auto" "false")
      (list "show_disks" "false")
      (list "shown_gpus" "\"nvidia amd intel\"") -}}
{{- range $set -}}
{{-   $line := printf "%s = %s" (index . 0) (index . 1) -}}
{{-   $re := printf "(?m)^%s *=.*$" (index . 0) -}}
{{-   if regexMatch $re $conf -}}
{{-     $conf = regexReplaceAll $re $conf $line -}}
{{-   else -}}
{{-     if and $conf (not (hasSuffix "\n" $conf)) }}{{ $conf = print $conf "\n" }}{{ end -}}
{{-     $conf = print $conf $line "\n" -}}
{{-   end -}}
{{- end -}}
{{- $conf -}}
